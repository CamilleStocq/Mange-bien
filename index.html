<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EFE2" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mange bien !" />
    <meta name="description" content="Mon application personnelle : repas, batch cooking, courses, sport et progression." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Mange bien !</title>
    <link rel="preload" as="image" href="/splash-legumes.webp" type="image/webp" fetchpriority="high" />
    <style>
      /* Écran d'accueil : affiché dès le premier rendu, retiré par l'app quand tout est chargé (1,5 s minimum) */
      html, body { margin: 0; background: #f6efe2; }
      #splash { position: fixed; inset: 0; z-index: 100; background: #f8e6c8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.3s ease-in; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .splash-art { width: min(88vw, 420px); height: auto; }
      #splash .splash-mark { margin: 0; font-weight: 900; font-size: clamp(3rem, 15vw, 4.4rem); line-height: 0.92; letter-spacing: -0.045em; color: #b4501f; text-align: center; }
      #splash .splash-mark span { color: #f5c63c; }
      #splash .loadbar { width: 160px; height: 6px; border-radius: 999px; background: rgba(180, 80, 31, 0.2); overflow: hidden; }
      #splash .loadbar span { display: block; height: 100%; border-radius: inherit; background: #b4501f; transform-origin: left; transform: scaleX(0.05); animation: load 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      @keyframes load { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } #splash .loadbar span { animation: none; transform: scaleX(0.6); } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Mange bien ! se charge">
      <img class="splash-art" src="/splash-legumes.webp" width="900" height="672" alt="" decoding="async" fetchpriority="high" />
      <p class="splash-mark">mange<br />bien<span>&nbsp;!</span></p>
      <div class="loadbar" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <noscript>Mange bien ! a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
